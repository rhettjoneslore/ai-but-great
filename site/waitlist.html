<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waitlist · AI But Great</title>
<meta name="description" content="Get in line for what we're launching next. Invite friends to move up.">
<meta name="theme-color" content="#F5F1E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<header id="masthead" data-compact="1"></header>

<main class="wrap" style="max-width:640px;padding-top:36px;padding-bottom:40px">
  <p class="kicker" id="launch-kicker">Coming soon</p>
  <h1 class="h-section" id="launch-title">Get in line.</h1>
  <p class="dek" id="launch-dek">We're launching something new. Join the list and we'll let you in by position. Every friend who joins with your link moves you up 25 spots.</p>

  <div class="classified" data-dev="Reusable per launch: waitlist.html?launch=NAME&title=...  POST /api/waitlist {email, launch, ref}. Each referred signup moves the referrer up. Contacts go to Loops tagged with the launch.">
    <form id="wl">
      <div class="row-inline"><input class="input" type="email" id="wl-email" placeholder="you@example.com" required autocomplete="email"><button class="btn btn-red" type="submit">Join the waitlist</button></div>
      <p class="mono muted" style="margin:10px 0 0">One email when it's your turn. Unsubscribe anytime.</p>
    </form>
    <div id="wl-done" class="hidden">
      <p class="label">You're in</p>
      <p style="font-family:var(--f-head);font-size:64px;line-height:1;margin:0" id="wl-pos"></p>
      <p class="muted">Share your link. Each friend who joins moves you up <b id="wl-per"></b> spots.</p>
      <div class="row-inline"><input class="input mono" readonly id="wl-link"><button class="btn btn-red" id="wl-copy">Copy link</button></div>
    </div>
  </div>
</main>

<footer id="footer"></footer>

<script src="js/formats.js?v=6"></script>
<script src="js/mock-api.js?v=6"></script>
<script src="js/common.js?v=6"></script>
<script>
(function () {
  const api = ABG.api, ui = ABG.ui;
  const q = new URLSearchParams(location.search);
  const launch = (q.get('launch') || 'default').replace(/[^\w-]/g, '');
  if (q.get('title')) document.getElementById('launch-title').textContent = q.get('title');
  if (launch !== 'default') document.getElementById('launch-kicker').textContent = 'Coming soon · ' + launch;
  document.getElementById('wl').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('wl-email').value.trim();
    const res = await api.joinWaitlist({ email, launch, ref: q.get('wref') });
    document.getElementById('wl').classList.add('hidden');
    document.getElementById('wl-done').classList.remove('hidden');
    document.getElementById('wl-pos').textContent = '#' + res.position.toLocaleString();
    document.getElementById('wl-per').textContent = res.perInvite;
    document.getElementById('wl-link').value = location.origin + location.pathname + '?launch=' + launch + '&wref=' + res.code;
  });
  document.getElementById('wl-copy').onclick = () => { ui.copy(document.getElementById('wl-link').value); api.trackReferralSent(); };
})();
</script>
</body>
</html>
